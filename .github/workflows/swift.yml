name: Build and Test

on:
  push:
  pull_request:
  schedule:
    - cron: "45 8 * * 1"

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - swift:5.9.2-focal
          - swift:6.0-noble
          - swift:6.2-jammy
    container: ${{ matrix.image }}
    steps:
      - name: Install SQLite
        run: |
          apt-get update
          apt-get -y install libsqlite3-dev
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Build Swift Debug Package
        run: swift build -c debug
      - name: Build Swift Release Package
        run: swift build -c release
      - name: Run Swift Release Tests
        run: swift test -c release
  nextstep:
    runs-on: macos-latest
    steps:
      - name: Select latest available Xcode
        uses: maxim-lobanov/setup-xcode@v1.5.1
        with:
          xcode-version: latest
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Build Xcode Project
        run: >-
          xcodebuild -project ZeeQL3.xcodeproj -scheme ZeeQL
          -configuration Debug
      - name: Build Swift Debug Package
        run: swift build -c debug
      - name: Build Swift Release Package
        run: swift build -c release
      - name: Run Swift Release Tests
        run: swift test -c release
      - name: Run Xcode Release Tests
        run: >-
          xcodebuild -project ZeeQL3.xcodeproj -scheme ZeeQL
          -configuration Release ENABLE_TESTABILITY=YES test

  strict-concurrency:
    runs-on: ubuntu-latest
    container: swift:6.2-jammy
    steps:
      - name: Install SQLite
        run: |
          apt-get update
          apt-get -y install libsqlite3-dev
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Build With Complete Concurrency Checking
        # Diagnostic-only in Swift 5 mode; warnings are not promoted to errors.
        run: swift build -Xswiftc -strict-concurrency=complete

  address-sanitizer:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Run Release Tests With AddressSanitizer
        run: swift test -c release --sanitize address
